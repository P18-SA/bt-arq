<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BT Arquitectas</title>
  <meta name="description" content="Nuestra nueva web está en construcción. Volvé pronto." />
  <link rel="icon" href="/favicon.ico" />
  
  <!-- Fuente Google Work Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 5vw;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .logo-container img {
      display: block;
      height: auto;
      width: 100%;
      max-width: min(88vw, clamp(20rem, 52vw, 46rem));
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1em;
      padding-top: 6vw;
      padding-bottom: max(1.5rem, 1.5vh);
      padding-left: 1rem;
      padding-right: 1rem;
      text-align: center;
      font-size: clamp(0.8125rem, 0.7rem + 0.55vw, 1.0625rem);
      line-height: 1.25;
    }

    footer p {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .ig-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
    }

    .ig-link:hover .ig-text {
      text-decoration: underline;
    }

    .ig-icon {
      height: 1.15em;
      width: 1.15em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-container">
      <img src="logo.png" alt="Berthet + Taranto" width="547" height="92" />
    </div>

    <footer>
      <p>Nuestra nueva web está en construcción</p>
      <p>¡Volvé pronto!</p>
      <p>
        <a href="https://www.instagram.com/berthet-taranto/" target="_blank" rel="noopener noreferrer" class="ig-link">
          <span class="ig-text">Visitanos en</span>
          <svg class="ig-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.5" cy="6.5" r="1.15" fill="currentColor" stroke="none"></circle>
          </svg>
          <span class="ig-text">berthet-taranto</span>
        </a>
      </p>
      <p>
        <a href="mailto:info@berthet-taranto.uy">info@berthet-taranto.uy</a>
      </p>
    </footer>
  </main>
</body>
</html>
